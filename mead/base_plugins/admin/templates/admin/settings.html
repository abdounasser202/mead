{% extends "base.html" %}
{% block title %}Paramètres — Administration{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-6 mx-auto">
    <h1 class="h4 mb-4"><i class="bi bi-gear me-2"></i>Paramètres du site</h1>

    <form method="post" action="/admin/settings">
      <div class="mb-3">
        <label for="blog_name" class="form-label fw-semibold">Nom du site</label>
        <input type="text" class="form-control" id="blog_name" name="blog_name"
               value="{{ settings_obj.blog_name }}" required>
      </div>
      <div class="mb-4">
        <label for="blog_description" class="form-label fw-semibold">Description</label>
        <textarea class="form-control" id="blog_description" name="blog_description"
                  rows="3">{{ settings_obj.blog_description }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i>Enregistrer
        </button>
        <a href="/admin" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

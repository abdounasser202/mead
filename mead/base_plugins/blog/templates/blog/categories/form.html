{% extends "base.html" %}
{% block title %}{{ 'Modifier' if category else 'Nouvelle' }} catégorie{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-5 mx-auto">
    <h1 class="h4 mb-4">
      <i class="bi bi-folder me-2"></i>
      {{ 'Modifier la catégorie' if category else 'Nouvelle catégorie' }}
    </h1>
    <form method="post"
          action="{{ '/admin/categories/' ~ category.id ~ '/edit' if category else '/admin/categories/new' }}">
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Nom</label>
        <input type="text" class="form-control" id="name" name="name"
               value="{{ category.name if category else '' }}" required autofocus>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="/admin/categories" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

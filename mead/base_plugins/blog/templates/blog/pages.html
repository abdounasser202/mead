{% extends "base.html" %}
{% block title %}Pages — Administration{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-9 mx-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0"><i class="bi bi-layout-text-window me-2"></i>Pages</h1>
      <a href="/admin/pages/new" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Nouvelle page
      </a>
    </div>

    {% if pages %}
    <div class="list-group">
      {% for page in pages %}
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <a href="/post/{{ page.slug }}" class="text-decoration-none text-dark fw-semibold">
          {{ page.title }}
        </a>
        <div class="d-flex gap-2">
          <a href="/admin/pages/{{ page.id }}/edit" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-pencil"></i>
          </a>
          <form method="post" action="/admin/pages/{{ page.id }}/delete"
                onsubmit="return confirm('Supprimer cette page ?')">
            <button class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <p class="text-muted">Aucune page.</p>
    {% endif %}
  </div>
</div>
{% endblock %}

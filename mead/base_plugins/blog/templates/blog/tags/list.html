{% extends "base.html" %}
{% block title %}Tags — Administration{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-7 mx-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0"><i class="bi bi-tags me-2"></i>Tags</h1>
      <a href="/admin/tags/new" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Nouveau tag
      </a>
    </div>

    {% if tags %}
    <div class="d-flex flex-wrap gap-2 mb-4">
      {% for tag in tags %}
      <div class="card">
        <div class="card-body py-2 px-3 d-flex align-items-center gap-3">
          <span class="fw-semibold">#{{ tag.name }}</span>
          <span class="text-muted small">{{ tag.posts | length }}</span>
          <a href="/admin/tags/{{ tag.id }}/edit" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-pencil"></i>
          </a>
          <form method="post" action="/admin/tags/{{ tag.id }}/delete"
                onsubmit="return confirm('Supprimer ?')">
            <button class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <p class="text-muted">Aucun tag.</p>
    {% endif %}

    <a href="/admin" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>Dashboard
    </a>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ 'Modifier' if tag else 'Nouveau' }} tag{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-5 mx-auto">
    <h1 class="h4 mb-4">
      <i class="bi bi-tag me-2"></i>
      {{ 'Modifier le tag' if tag else 'Nouveau tag' }}
    </h1>
    <form method="post"
          action="{{ '/admin/tags/' ~ tag.id ~ '/edit' if tag else '/admin/tags/new' }}">
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Nom</label>
        <input type="text" class="form-control" id="name" name="name"
               value="{{ tag.name if tag else '' }}" required autofocus>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="/admin/tags" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
